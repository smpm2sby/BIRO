<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Presensi BiroKu</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS Khusus untuk fitur Cetak PDF */
        @media print {
            body { background: white !important; color: black; margin: 0; padding: 0; }
            .print-hidden { display: none !important; }
            .print-block { display: block !important; }
            .print-table { width: 100%; border-collapse: collapse; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: left; }
            .print-table th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .shadow-sm, .shadow-md, .shadow-xl { box-shadow: none !important; border: none !important; }
            main { padding: 0 !important; }
        }
        .print-block { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // ==========================================
        // 1. SUPABASE CONFIGURATION
        // ==========================================
        const supabaseUrl = 'https://llpzbfjolgfavofhblpw.supabase.co'; 
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscHpiZmpvbGdmYXZvZmhibHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5Njk2OTksImV4cCI6MjEwMDU0NTY5OX0.vP9bIcau_sej8Nc96mHtvXWHVj7BP0XcnrSFEZaARwg';
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        const MAPEL_BIRO = [
            "Biro Pramuka", "Biro Jurnalistik", "Biro Paduan Suara", 
            "Biro Robotik", "Biro Olahraga", "Biro Tari Tradisional"
        ];

        // ==========================================
        // 2. MAIN APP COMPONENT
        // ==========================================
        function App() {
            const [appUser, setAppUser] = useState(null); 
            const [sessions, setSessions] = useState([]);
            const [attendances, setAttendances] = useState([]);
            const [students, setStudents] = useState([]);
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            const fetchData = async () => {
                try {
                    const { data: sessionData } = await supabaseClient.from('sessions').select('*');
                    const { data: attendanceData } = await supabaseClient.from('attendances').select('*');
                    const { data: studentData } = await supabaseClient
                        .from('students')
                        .select('*')
                        .order('kelas', { ascending: true })
                        .order('rombel', { ascending: true })
                        .order('nama', { ascending: true });

                    const mappedSessions = (sessionData || []).map(s => ({
                        id: s.id, date: s.tanggal, mapel: s.mapel_biro, topik: s.topik
                    }));
                    const mappedAttendances = (attendanceData || []).map(a => ({
                        id: a.id, sessionId: a.session_id, studentId: a.student_id
                    }));

                    setSessions(mappedSessions);
                    setAttendances(mappedAttendances);
                    setStudents(studentData || []);
                    setIsDataLoaded(true);
                } catch (error) {
                    console.error("Error fetching:", error);
                    setIsDataLoaded(true); 
                }
            };

            useEffect(() => {
                if (appUser) fetchData();
            }, [appUser]);

            const handleLogin = async (username, password, setStatus) => {
                try {
                    const { data, error } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('username', username)
                        .eq('password', password)
                        .single();

                    if (error || !data) {
                        alert("Username atau Password salah! Pastikan data ada di database.");
                        setStatus('idle');
                    } else {
                        setAppUser({ 
                            id: data.id, 
                            role: data.role, 
                            username: data.username,
                            namaLengkap: data.nama_lengkap 
                        });
                    }
                } catch (err) {
                    alert("Gagal menghubungi database!");
                    setStatus('idle');
                }
            };

            if (!appUser) return <LoginScreen onLogin={handleLogin} />;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-blue-600 text-white shadow-md print-hidden sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold text-lg">
                                <i className="fas fa-book-open"></i> Presensi BiroKu
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="text-sm font-bold leading-none">{appUser.namaLengkap}</p>
                                    <span className="text-[10px] bg-blue-800 px-2 py-0.5 rounded-full uppercase">{appUser.role}</span>
                                </div>
                                <button onClick={() => setAppUser(null)} className="p-2 bg-red-500 rounded-full hover:bg-red-600" title="Logout"><i className="fas fa-sign-out-alt"></i></button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pb-24 pt-4 px-4 max-w-7xl mx-auto w-full">
                        {!isDataLoaded ? (
                            <div className="flex justify-center items-center h-64">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                            </div>
                        ) : (
                            appUser.role === 'guru' 
                                ? <GuruDashboard sessions={sessions} attendances={attendances} students={students} refreshData={fetchData} guruId={appUser.id} /> 
                                : <AdminDashboard sessions={sessions} attendances={attendances} students={students} />
                        )}
                    </main>
                </div>
            );
        }

        // ==========================================
        // 3. LOGIN SCREEN
        // ==========================================
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [status, setStatus] = useState('idle');

            const submit = (e) => {
                e.preventDefault();
                setStatus('loading');
                onLogin(username, password, setStatus);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <form onSubmit={submit} className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl space-y-4 border border-gray-100">
                        <div className="text-center mb-6">
                            <i className="fas fa-book-open text-blue-600 text-4xl mb-2"></i>
                            <h2 className="text-2xl font-bold">Presensi Biro</h2>
                            <p className="text-sm text-gray-500 mt-1">Silakan masuk menggunakan akun database Anda</p>
                        </div>
                        <div>
                            <label className="text-sm font-medium">Username</label>
                            <input type="text" required className="w-full mt-1 p-3 border rounded-xl outline-none focus:border-blue-500 bg-gray-50" value={username} onChange={e => setUsername(e.target.value)} />
                        </div>
                        <div>
                            <label className="text-sm font-medium">Password</label>
                            <input type="password" required className="w-full mt-1 p-3 border rounded-xl outline-none focus:border-blue-500 bg-gray-50" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button type="submit" disabled={status === 'loading'} className={`w-full py-3 text-white font-bold rounded-xl shadow-lg mt-4 ${status === 'loading' ? 'bg-blue-400' : 'bg-blue-600 hover:bg-blue-700'}`}>
                            {status === 'loading' ? 'Mengecek Database...' : 'Masuk'}
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 4. GURU DASHBOARD (OPTIMISTIC UI ENABLED)
        // ==========================================
        function GuruDashboard({ sessions, attendances, students, refreshData, guruId }) {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [mapel, setMapel] = useState(MAPEL_BIRO[0]);
            const [topik, setTopik] = useState('');
            
            const [searchName, setSearchName] = useState('');
            const [filterKelas, setFilterKelas] = useState('');
            const [filterRombel, setFilterRombel] = useState('');

            const [presentStudentIds, setPresentStudentIds] = useState(new Set());
            const [isSaving, setIsSaving] = useState(false);
            
            const existingSession = useMemo(() => sessions.find(s => s.date === date && s.mapel === mapel), [sessions, date, mapel]);

            useEffect(() => {
                if (existingSession) {
                    setTopik(existingSession.topik);
                    const sessionAttd = attendances.filter(a => a.sessionId === existingSession.id);
                    setPresentStudentIds(new Set(sessionAttd.map(a => a.studentId)));
                } else {
                    setTopik('');
                    setPresentStudentIds(new Set());
                }
            }, [existingSession, attendances]);

            const filteredStudents = useMemo(() => students.filter(s => {
                const matchName = s.nama.toLowerCase().includes(searchName.toLowerCase());
                const matchKelas = filterKelas ? s.kelas === filterKelas : true;
                const matchRombel = filterRombel ? s.rombel === filterRombel : true;
                return matchName && matchKelas && matchRombel;
            }), [searchName, filterKelas, filterRombel, students]);

            // Optimistic UI toggle
            const toggleAttendance = (id) => {
                setPresentStudentIds(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
                    return newSet;
                });
            };

            const handleSimpan = async () => {
                if (!topik.trim()) return alert("Mohon isi topik pembelajaran terlebih dahulu!");

                setIsSaving(true);
                try {
                    let sessionId = existingSession?.id;
                    
                    if (sessionId) {
                        await supabaseClient.from('sessions').update({ topik }).eq('id', sessionId);
                    } else {
                        const { data } = await supabaseClient.from('sessions').insert([{ 
                            tanggal: date, 
                            mapel_biro: mapel, 
                            topik: topik, 
                            guru_id: guruId 
                        }]).select();
                        sessionId = data[0].id;
                    }

                    await supabaseClient.from('attendances').delete().eq('session_id', sessionId);
                    
                    const attToInsert = Array.from(presentStudentIds).map(studentId => ({ 
                        session_id: sessionId, 
                        student_id: studentId 
                    }));
                    
                    if (attToInsert.length > 0) {
                        await supabaseClient.from('attendances').insert(attToInsert);
                    }

                    await refreshData();
                    alert("Presensi berhasil disimpan ke database!");
                } catch (error) {
                    alert("Gagal menyimpan data ke database!");
                    console.error(error);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="max-w-2xl mx-auto relative">
                    <div className="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-gray-100">
                        <h3 className="font-bold mb-4 flex items-center gap-2"><i className="fas fa-calendar-alt text-blue-600"></i> Setup Kelas & Topik</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Tanggal</label>
                                <input type="date" className="w-full p-2.5 border rounded-xl bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" value={date} onChange={e => setDate(e.target.value)} />
                            </div>
                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Mapel Biro</label>
                                <select className="w-full p-2.5 border rounded-xl bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" value={mapel} onChange={e => setMapel(e.target.value)}>
                                    {MAPEL_BIRO.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                        </div>
                        <label className="text-xs font-semibold text-gray-500 mb-1 block">Topik Pembelajaran Hari Ini</label>
                        <textarea rows="2" className="w-full p-3 border rounded-xl resize-none outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50" placeholder="Ketik topik yang diajarkan..." value={topik} onChange={e => setTopik(e.target.value)}></textarea>
                    </div>

                    <div className="bg-blue-50 p-4 rounded-2xl mb-4 sticky top-16 z-40 shadow-sm border border-blue-100">
                        <div className="relative mb-3">
                            <i className="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                            <input type="text" placeholder="Cari nama siswa dengan cepat..." className="w-full pl-10 pr-3 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-400 border-none shadow-sm" value={searchName} onChange={e => setSearchName(e.target.value)} />
                        </div>
                        <div className="flex gap-2">
                            <select className="flex-1 p-2 border-none rounded-xl shadow-sm outline-none bg-white text-sm" value={filterKelas} onChange={e => setFilterKelas(e.target.value)}>
                                <option value="">Semua Kelas (7,8,9)</option>
                                <option value="7">Kelas 7</option><option value="8">Kelas 8</option><option value="9">Kelas 9</option>
                            </select>
                            <select className="flex-1 p-2 border-none rounded-xl shadow-sm outline-none bg-white text-sm" value={filterRombel} onChange={e => setFilterRombel(e.target.value)}>
                                <option value="">Semua Rombel (A-G)</option>
                                {['A','B','C','D','E','F','G'].map(r => <option key={r} value={r}>Rombel {r}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm overflow-hidden mb-24 border border-gray-100">
                        <div className="p-4 bg-gray-50 flex justify-between font-bold text-sm border-b">
                            <span>Daftar Siswa</span>
                            <span className="text-blue-600 bg-blue-100 px-3 py-1 rounded-full">{presentStudentIds.size} Hadir</span>
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto divide-y">
                            {filteredStudents.length === 0 ? (
                                <p className="p-6 text-center text-gray-500 text-sm">Tidak ada siswa yang cocok dengan pencarian.</p>
                            ) : (
                                filteredStudents.map(student => {
                                    const isPresent = presentStudentIds.has(student.id);
                                    return (
                                        <div key={student.id} onClick={() => toggleAttendance(student.id)} className={`flex justify-between items-center p-4 cursor-pointer transition-colors ${isPresent ? 'bg-blue-50' : 'hover:bg-gray-50'}`}>
                                            <div>
                                                <p className={`font-medium ${isPresent ? 'text-blue-800' : ''}`}>{student.nama}</p>
                                                <p className="text-xs text-gray-500">Kelas {student.kelas} - {student.rombel}</p>
                                            </div>
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${isPresent ? 'bg-blue-500 border-blue-500' : 'border-gray-300'}`}>
                                                {isPresent && <i className="fas fa-check text-white text-xs"></i>}
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>

                    <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-11/12 max-w-sm z-50">
                        <button disabled={isSaving} onClick={handleSimpan} className="w-full py-4 bg-blue-600 text-white font-bold rounded-full shadow-2xl hover:bg-blue-700 transition-colors flex justify-center items-center gap-2">
                            {isSaving ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>}
                            {isSaving ? 'Menyimpan...' : 'Simpan Presensi'}
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. ADMIN DASHBOARD (FITUR SORTIR COLUMN ADDED)
        // ==========================================
        function AdminDashboard({ sessions, attendances, students }) {
            const today = new Date();
            const [filterType, setFilterType] = useState('year'); 
            const [filterValue, setFilterValue] = useState(today.getFullYear().toString());
            const [filterMapel, setFilterMapel] = useState('');
            const [searchStudent, setSearchStudent] = useState('');
            const [selectedStudent, setSelectedStudent] = useState(null);

            // State untuk Fitur Sortir Kolom Tabel
            const [sortField, setSortField] = useState('totalHadir'); // default 'totalHadir', 'nama', atau 'kelas'
            const [sortOrder, setSortOrder] = useState('desc'); // 'asc' atau 'desc'

            const handleFilterTypeChange = (type) => {
                setFilterType(type);
                if(type === 'year') setFilterValue(today.getFullYear().toString());
                if(type === 'month') setFilterValue(`${today.getFullYear()}-${(today.getMonth()+1).toString().padStart(2, '0')}`);
                if(type === 'date') setFilterValue(today.toISOString().split('T')[0]);
            };

            const handleSort = (field) => {
                if (sortField === field) {
                    setSortOrder(prev => prev === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortField(field);
                    setSortOrder(field === 'totalHadir' ? 'desc' : 'asc');
                }
            };

            const renderSortIcon = (field) => {
                if (sortField !== field) return <i className="fas fa-sort text-gray-300 ml-1 text-xs"></i>;
                return sortOrder === 'asc' 
                    ? <i className="fas fa-sort-up text-blue-600 ml-1 text-xs"></i> 
                    : <i className="fas fa-sort-down text-blue-600 ml-1 text-xs"></i>;
            };

            const recapData = useMemo(() => {
                const validSessions = sessions.filter(s => {
                    const matchDate = s.date.startsWith(filterValue);
                    const matchMapel = filterMapel ? s.mapel === filterMapel : true;
                    return matchDate && matchMapel;
                });

                const validSessionIds = new Set(validSessions.map(s => s.id));
                const studentCounts = {};
                
                attendances.forEach(att => {
                    if (validSessionIds.has(att.sessionId)) {
                        studentCounts[att.studentId] = (studentCounts[att.studentId] || 0) + 1;
                    }
                });

                let results = students.map(s => ({
                    ...s, totalHadir: studentCounts[s.id] || 0
                })).filter(s => s.totalHadir > 0); 

                if (searchStudent) {
                    results = results.filter(s => s.nama.toLowerCase().includes(searchStudent.toLowerCase()));
                }

                // Pengurutan Dinamis Berdasarkan Kolom
                return results.sort((a, b) => {
                    let aVal = a[sortField];
                    let bVal = b[sortField];

                    if (sortField === 'kelas') {
                        aVal = `${a.kelas}-${a.rombel}`;
                        bVal = `${b.kelas}-${b.rombel}`;
                    }

                    if (typeof aVal === 'string') {
                        const cmp = aVal.localeCompare(bVal, 'id', { numeric: true });
                        return sortOrder === 'asc' ? cmp : -cmp;
                    }

                    return sortOrder === 'asc' ? aVal - bVal : bVal - aVal;
                });
            }, [sessions, attendances, filterType, filterValue, filterMapel, searchStudent, sortField, sortOrder]);

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="print-block mb-6 text-center border-b pb-4">
                        <h1 className="text-2xl font-bold uppercase">Laporan Presensi Ekstrakurikuler / Biro</h1>
                        <p className="text-gray-600 mt-2">
                            Periode: {filterType === 'year' ? `Tahun ${filterValue}` : filterType === 'month' ? `Bulan ${filterValue}` : `Tanggal ${filterValue}`} <br/>
                            Mapel: {filterMapel || 'Semua Mapel'}
                        </p>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm mb-6 print-hidden border border-gray-100">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                            <h2 className="text-xl font-bold flex items-center gap-2"><i className="fas fa-chart-bar text-blue-600"></i> Rekap Kehadiran Siswa</h2>
                            <button onClick={() => window.print()} className="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                                <i className="fas fa-print"></i> Cetak Laporan (PDF)
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-xl">
                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Tipe Periode</label>
                                <select className="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={filterType} onChange={e => handleFilterTypeChange(e.target.value)}>
                                    <option value="year">Tahunan</option><option value="month">Bulanan</option><option value="date">Harian</option>
                                </select>
                            </div>
                            
                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Pilih Periode</label>
                                {filterType === 'year' && <input type="number" className="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={filterValue} onChange={e=>setFilterValue(e.target.value)} />}
                                {filterType === 'month' && <input type="month" className="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={filterValue} onChange={e=>setFilterValue(e.target.value)} />}
                                {filterType === 'date' && <input type="date" className="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={filterValue} onChange={e=>setFilterValue(e.target.value)} />}
                            </div>
                            
                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Mata Pelajaran</label>
                                <select className="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={filterMapel} onChange={e => setFilterMapel(e.target.value)}>
                                    <option value="">Semua Mapel</option>
                                    {MAPEL_BIRO.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-gray-500 mb-1 block">Cari Siswa</label>
                                <div className="relative">
                                    <i className="fas fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                                    <input type="text" placeholder="Nama siswa..." className="w-full border rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={searchStudent} onChange={e => setSearchStudent(e.target.value)}/>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Tabel Laporan Dengan Kolom Sortir */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto print-shadow-none">
                        <table className="w-full text-left print-table min-w-[600px]">
                            <thead className="bg-gray-50 text-sm uppercase text-gray-600 border-b">
                                <tr>
                                    <th 
                                        className="px-6 py-4 cursor-pointer hover:bg-gray-100 transition-colors select-none"
                                        onClick={() => handleSort('nama')}
                                        title="Klik untuk urutkan berdasarkan Nama"
                                    >
                                        Nama Siswa {renderSortIcon('nama')}
                                    </th>
                                    <th 
                                        className="px-6 py-4 cursor-pointer hover:bg-gray-100 transition-colors select-none"
                                        onClick={() => handleSort('kelas')}
                                        title="Klik untuk urutkan berdasarkan Kelas/Rombel"
                                    >
                                        Kelas/Rombel {renderSortIcon('kelas')}
                                    </th>
                                    <th 
                                        className="px-6 py-4 text-center cursor-pointer hover:bg-gray-100 transition-colors select-none"
                                        onClick={() => handleSort('totalHadir')}
                                        title="Klik untuk urutkan berdasarkan Total Kehadiran"
                                    >
                                        Total Kehadiran {renderSortIcon('totalHadir')}
                                    </th>
                                    <th className="px-6 py-4 text-center print-hidden">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {recapData.length === 0 ? (
                                    <tr><td colSpan="4" className="px-6 py-12 text-center text-gray-500">Tidak ada data kehadiran pada periode/filter ini.</td></tr>
                                ) : (
                                    recapData.map(s => (
                                        <tr key={s.id} className="hover:bg-gray-50 transition-colors">
                                            <td className="px-6 py-4 font-medium">{s.nama}</td>
                                            <td className="px-6 py-4 text-gray-600">{s.kelas} - {s.rombel}</td>
                                            <td className="px-6 py-4 text-center">
                                                <span className="bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full text-sm">{s.totalHadir} x</span>
                                            </td>
                                            <td className="px-6 py-4 text-center print-hidden">
                                                <button onClick={() => setSelectedStudent(s)} className="text-blue-600 font-medium hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors text-sm">Lihat Detail</button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal Detail Siswa */}
                    {selectedStudent && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 print-hidden backdrop-blur-sm">
                            <div className="bg-white rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex justify-between items-center p-5 border-b bg-gray-50 rounded-t-2xl">
                                    <div>
                                        <h3 className="font-bold text-lg">{selectedStudent.nama}</h3>
                                        <p className="text-sm text-gray-500">Kelas {selectedStudent.kelas} - Rombel {selectedStudent.rombel}</p>
                                    </div>
                                    <button onClick={() => setSelectedStudent(null)} className="w-8 h-8 flex items-center justify-center bg-gray-200 hover:bg-red-100 hover:text-red-600 rounded-full transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-5 overflow-y-auto flex-1">
                                    <p className="text-sm font-semibold mb-4 text-gray-700">Riwayat Presensi & Topik Pembelajaran:</p>
                                    <div className="space-y-3">
                                        {attendances.filter(a => a.studentId === selectedStudent.id).reverse().map(att => {
                                            const session = sessions.find(s => s.id === att.sessionId && s.date.startsWith(filterValue) && (filterMapel ? s.mapel === filterMapel : true));
                                            if(!session) return null;
                                            return (
                                                <div key={att.id} className="p-4 border rounded-xl bg-blue-50 border-blue-100">
                                                    <div className="flex justify-between font-bold text-sm mb-1">
                                                        <span className="text-gray-800"><i className="fas fa-book text-blue-500 mr-1"></i> {session.mapel}</span>
                                                        <span className="text-blue-600 bg-white px-2 py-0.5 rounded text-xs">{session.date}</span>
                                                    </div>
                                                    <p className="text-sm text-gray-700 mt-2 bg-white p-2 rounded-lg border border-blue-50">
                                                        <span className="font-semibold text-xs text-gray-500 block mb-0.5">Topik:</span>
                                                        {session.topik || '-'}
                                                    </p>
                                                </div>
                                            );
                                        })}
                                        {attendances.filter(a => a.studentId === selectedStudent.id && sessions.find(s => s.id === a.sessionId && s.date.startsWith(filterValue) && (filterMapel ? s.mapel === filterMapel : true))).length === 0 && (
                                            <p className="text-center text-gray-500 text-sm py-4">Tidak ada riwayat pada periode ini.</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
